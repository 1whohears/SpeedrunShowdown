name: SpeedrunShowdown
version: 2.1.8
author: KaiNakamura
main: com.github.speedrunshowdown.SpeedrunShowdown
api-version: 1.21.5
load: STARTUP
commands:
  start:
    description: Start the game
    permission: speedrunshowdown
    usage: /start
  stop:
    description: Stop the game
    permission: speedrunshowdown
    usage: /stop
  config:
    description: Open config gui
    permission: speedrunshowdown
    usage: /config
  resume:
    description: Resume the game (to be used if the server crashes during a game)
    permission: speedrunshowdown
    usage: /resume [minutes] [seconds]
  suddendeath:
    description: Set time until sudden death
    permission: speedrunshowdown
    usage: /suddendeath [minutes] [seconds]
  givecompass:
    description: Give a tracking compass
    permission: speedrunshowdown
    usage: /givecompass [player]
  givearmor:
    description: Give armor
    permission: speedrunshowdown
    usage: /givearmor [player]
  win:
    description: Declare the winning team
    permission: speedrunshowdown
    usage: /win (team|player)
  locatefortress:
    description: Get the coordinates of the nearest nether fortress
    permission: netherlocate
    usage: /locatefortress
  locatebastion:
    description: Get the coordinates of the nearest nether bastion
    permission: netherlocate
    usage: /locatebastion
  checknether:
    description: Check if a Fortress/Bastian is present in the nether inside the world boarder.
    permission: speedrunshowdown
    usage: /checknether
  listprogressionpoints:
    description: See a list of progression points. Who has what, and what is left.
    permission: netherlocate
    usage: /listprogressionpoints
permissions:
  speedrunshowdown:
    description: Allows speedrunshowdown commands
    default: op
  netherlocate:
    description: Allows the use of nether structure locate commands
    default: true